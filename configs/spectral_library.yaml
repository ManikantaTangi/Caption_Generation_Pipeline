# Reference spectral signatures for WHU-Hi-LongKou material classes.
# Each entry gives reflectance control points at key wavelengths (nm);
# the KnowledgeEngine interpolates these onto the sensor's band grid.
# Values are illustrative of known vegetation/water/soil spectral behaviour
# (visible red-edge rise for chlorophyll-bearing crops, flat low reflectance
# for water, etc.) and are used as the retrieval library, not ground truth.
materials:
  Corn:
    category: "vegetation"
    control_points:
      { 450: 0.05, 550: 0.11, 650: 0.06, 700: 0.15, 800: 0.45, 900: 0.48 }
    description: "Broad-leaf cereal crop with strong NIR plateau and red-edge rise."
  Cotton:
    category: "vegetation"
    control_points:
      { 450: 0.06, 550: 0.13, 650: 0.07, 700: 0.18, 800: 0.42, 900: 0.44 }
    description: "Fibre crop, moderate NIR reflectance, canopy-dependent texture."
  Sesame:
    category: "vegetation"
    control_points:
      { 450: 0.05, 550: 0.10, 650: 0.055, 700: 0.14, 800: 0.40, 900: 0.41 }
    description: "Oilseed crop with narrow canopy and lower NIR plateau than corn."
  Broad-leaf soybean:
    category: "vegetation"
    control_points:
      { 450: 0.055, 550: 0.12, 650: 0.06, 700: 0.16, 800: 0.47, 900: 0.50 }
    description: "Legume with high chlorophyll content, strong red-edge slope."
  Narrow-leaf soybean:
    category: "vegetation"
    control_points:
      { 450: 0.05, 550: 0.11, 650: 0.055, 700: 0.15, 800: 0.44, 900: 0.46 }
    description: "Soybean cultivar variant, slightly lower canopy density."
  Rice:
    category: "vegetation"
    control_points:
      { 450: 0.045, 550: 0.10, 650: 0.05, 700: 0.13, 800: 0.38, 900: 0.40 }
    description: "Paddy crop, often co-located with standing water background."
  Mixed weed:
    category: "vegetation"
    control_points:
      { 450: 0.06, 550: 0.115, 650: 0.07, 700: 0.145, 800: 0.35, 900: 0.36 }
    description: "Heterogeneous, unmanaged vegetation with a lower/noisier NIR plateau than cultivated crops."
  Water:
    category: "water"
    control_points:
      { 450: 0.04, 550: 0.03, 650: 0.015, 700: 0.01, 800: 0.005, 900: 0.004 }
    description: "Strong absorption beyond red edge; low, flat NIR reflectance."
  Roads and houses:
    category: "built-up"
    control_points:
      { 450: 0.12, 550: 0.14, 650: 0.16, 700: 0.17, 800: 0.19, 900: 0.20 }
    description: "Man-made surfaces: comparatively flat, moderate reflectance, no red-edge."
  Background:
    category: "background"
    control_points:
      { 450: 0.08, 550: 0.08, 650: 0.08, 700: 0.08, 800: 0.08, 900: 0.08 }
    description: "Unlabelled / mixed background pixels."
